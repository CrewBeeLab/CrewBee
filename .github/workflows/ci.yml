name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: opencode-ai@1.18.29
            major: 1
          - package: '@opencode/cli@2.2.0'
            major: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install supported host
        run: npm install --prefix .artifacts/host '${{ matrix.package }}' --no-audit --no-fund
      - name: Verify real host loading
        run: node scripts/smoke-opencode-host.mjs .artifacts/host/node_modules/.bin/opencode '${{ matrix.major }}'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

  simulate-opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run OpenCode simulator
        run: npm run simulate:opencode

  simulate-compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run compaction simulator
        run: npm run simulate:compact

  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai@latest

      - name: Install local CrewBee package
        run: npm run install:local:user

      - name: Run doctor
        run: npm run doctor

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack release tarball
        run: npm run pack:release

      - name: Smoke test packed package
        run: |
          set -euo pipefail
          TARBALL=$(find .artifacts/release -name 'crewbee-*.tgz' -print -quit)
          if [ -z "$TARBALL" ]; then
            echo "::error::release tarball was not generated."
            exit 1
          fi
          node ./scripts/smoke-packed-package.mjs "$TARBALL"
